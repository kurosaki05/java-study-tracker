<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>学習記録一覧</title>
</head>

<body>

    <h1>学習記録一覧</h1>

    <p>
        <a th:href="@{/records/new}">
            新しい学習記録を登録する
        </a>
    </p>

    <!-- 学習記録が0件の場合に表示します -->
    <p th:if="${#lists.isEmpty(records)}">
        学習記録はまだ登録されていません。
    </p>

    <!-- 学習記録が存在する場合に表示します -->
    <table border="1"
           th:unless="${#lists.isEmpty(records)}">

        <thead>
            <tr>
                <th>ID</th>
                <th>学習日</th>
                <th>科目</th>
                <th>回答数</th>
                <th>正解数</th>
                <th>正答率</th>
                <th>学習時間</th>
                <th>メモ</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>

            <!-- 学習記録を1件ずつ取り出して表示します -->
            <tr th:each="record : ${records}">

                <td th:text="${record.id}"></td>

                <td th:text="${record.studyDate}"></td>

                <td th:text="${record.subject}"></td>

                <td th:text="${record.questionCount}"></td>

                <td th:text="${record.correctCount}"></td>

                <td>
                    <span th:text="${#numbers.formatDecimal(
                        record.correctRate, 1, 1)}">
                    </span>%
                </td>

                <td>
                    <span th:text="${record.studyMinutes}"></span>分
                </td>

                <td th:text="${record.memo}"></td>

                <!-- 編集・削除ボタン -->
                <td>
                    <!--
                        選択した学習記録のIDを編集URLへ渡します。
                        例：/records/1/edit
                    -->
                    <a th:href="@{/records/{id}/edit(id=${record.id})}">
                        編集
                    </a>

                    <!--
                        削除はデータを変更する処理なので、
                        リンクではなくPOST形式のフォームを使用します。
                    -->
                    <form th:action="@{/records/{id}/delete(id=${record.id})}"
                          method="post"
                          style="display: inline;">

                        <!--
                            削除前に確認メッセージを表示します。

                            キャンセルが選ばれた場合は、
                            削除処理を実行しません。
                        -->
                        <button type="submit"
                                onclick="return confirm('この学習記録を削除しますか？');">
                            削除
                        </button>
                    </form>
                </td>

            </tr>

        </tbody>
    </table>

    <p>
        <a th:href="@{/}">
            トップ画面へ戻る
        </a>
    </p>

</body>
</html>
